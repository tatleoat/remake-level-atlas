<title>REmake Level Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Libre+Baskerville:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=VT323&display=swap">
<style>
/* Layout: one-screen instrument. Map on the left (floor tabs above it), case-file side panel on the right; stacks on phones.
   Single dark theme on purpose: it mirrors the game's own map screen. */
:root {
  color-scheme: dark;
  --ink: #0a0e13;        /* page */
  --panel: #10161e;      /* side panel */
  --raise: #17202b;      /* controls, cards */
  --line: #253140;       /* hairlines */
  --text: #d8dee7;
  --muted: #8593a6;
  --room: #1a2633;       /* room never reachable in this state */
  --room-line: #3b4b5e;
  --reach: #2c6683;      /* reachable now (the game's map blue) */
  --reach-hi: #3f87ab;
  --seen: #4d93b5;       /* visited this run */
  --locked: #3a1c22;     /* behind a lock */
  --amber: #e8a33d;      /* you, the route, the selection */
  --amber-dim: #8a6226;
  --herb: #6fae5f;       /* save rooms, good */
  --blood: #d0574f;      /* locks, danger */
  --violet: #9b84d6;     /* event and puzzle gates */
  --door: #d6a84c;       /* door marks, gold as on the game's map */
  --hatch: #5d6f83;      /* stair hatching */
  --raised: rgba(4, 8, 12, .38); /* raised floor and landings */
  --display: "Special Elite", "Courier New", monospace;
  --ui: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --lcd: var(--mono);    /* big numbers */
  --route: var(--amber); /* route lines */
  --ramp: #16202b, #1d3a4f, #22607a, #3f8f9a, #b9a45a, #e8a33d, #f6d9a8; /* metric colouring, low to high */
  --mapbg: radial-gradient(ellipse at 50% 40%, #0f1620 0%, var(--ink) 75%);
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font: 14px/1.45 var(--ui); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 12px; margin-right: auto; min-width: 0; }
.brand h1 { font: 400 22px/1 var(--display); letter-spacing: .02em; margin: 0; text-wrap: balance; }
.brand small { color: var(--muted); font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 5px 11px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--text); box-shadow: inset 0 -2px 0 var(--amber); }
.ctl { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
select { background: var(--raise); border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px; text-transform: none; letter-spacing: 0; font-size: 13px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; min-height: 0; padding-block: 12px; }
.mapcol { display: grid; grid-template-rows: auto auto 1fr; gap: 8px; min-height: 0; min-width: 0; }
.floors { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.fgroup { display: inline-flex; align-items: center; gap: 4px; }
.fgroup > span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-right: 2px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 3px; padding: 2px 7px; font: 500 12px/1.4 var(--mono); color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
.chip .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); margin-left: 4px; vertical-align: 1px; }
.maptools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.toggle { display: inline-flex; gap: 5px; align-items: center; font-size: 12px; color: var(--muted); }
.toggle input { accent-color: var(--amber); }
.zoom { margin-left: auto; display: inline-flex; gap: 4px; }
.zoom button { width: 28px; height: 26px; border: 1px solid var(--line); background: var(--raise); border-radius: 3px; }
.mapwrap { position: relative; min-height: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--mapbg); }
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; }
#map.dragging { cursor: grabbing; }
.legend { position: absolute; left: 10px; bottom: 10px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line);
  border-radius: 3px; padding: 6px 9px; font-size: 11px; color: var(--muted); display: grid; gap: 3px; max-width: calc(100% - 20px); }
.legend .row { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.sw { display: inline-block; width: 12px; height: 10px; border: 1px solid var(--room-line); vertical-align: -1px; margin-right: 4px; }
.ramp { display: inline-block; width: 120px; height: 8px; border-radius: 2px; vertical-align: 0; margin: 0 6px; }
.tip { position: absolute; pointer-events: none; background: var(--raise); border: 1px solid var(--line); border-radius: 3px; padding: 4px 8px; font-size: 12px; max-width: 260px; z-index: 3; }
.floorname { position: absolute; right: 12px; top: 8px; font: 400 18px var(--display); color: var(--muted); pointer-events: none; }

/* map marks */
.room { stroke: var(--room-line); stroke-width: .7; vector-effect: non-scaling-stroke; transition: fill .25s; }
.room:hover { stroke: var(--text); }
.room.sel { stroke: var(--amber); stroke-width: 2.2; }
.room.pos { stroke: var(--amber); stroke-width: 1.6; }
.lbl { fill: var(--text); font-family: var(--ui); paint-order: stroke; stroke: rgba(6, 9, 13, .85); stroke-width: 2.2px; stroke-linejoin: round; pointer-events: none; }
.lbl.dim { fill: var(--muted); }
.dbar { stroke: var(--ink); stroke-width: .5; vector-effect: non-scaling-stroke; }
.dbar.open { fill: var(--door); }
.dbar.key { fill: var(--blood); }
.dbar.event { fill: var(--violet); }
.dbar.bolt { fill: var(--door); stroke: var(--blood); stroke-width: 1.6; stroke-dasharray: 2 1.2; }
.dbar.sealed { fill: #4b5664; }
.opening { fill: none; stroke: #a9bccf; stroke-width: 1.1; stroke-dasharray: 1.6 1.2; vector-effect: non-scaling-stroke; }
.opening.key { stroke: var(--blood); } .opening.event { stroke: var(--violet); }
.hatch { fill: var(--hatch); pointer-events: none; }
.raised { fill: var(--raised); pointer-events: none; }
.xtag { cursor: pointer; }
.xlink { fill: var(--raise); stroke: var(--door); stroke-width: .8; vector-effect: non-scaling-stroke; }
.xtag:hover .xlink, .xtag:focus-visible .xlink { fill: #24313f; stroke-width: 2; }
.xtag:focus-visible { outline: none; }
.xglyph { fill: var(--door); } .xglyph.key { fill: var(--blood); } .xglyph.event { fill: var(--violet); }
.xglyph-ink { fill: none; stroke: var(--ink); stroke-width: .75; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.arrive { fill: none; stroke: var(--amber); stroke-width: 2; vector-effect: non-scaling-stroke; pointer-events: none; animation: arrive 1.2s ease-out 3; transform-box: fill-box; transform-origin: center; opacity: 0; }
@keyframes arrive { from { opacity: 1; transform: scale(.4); } to { opacity: 0; transform: scale(1.8); } }
.xlink.key { stroke: var(--blood); } .xlink.event { stroke: var(--violet); } .xlink.bolt { stroke: var(--blood); stroke-dasharray: 2 1.2; }
.xtxt { fill: var(--text); font: 500 4.6px var(--mono); pointer-events: none; }
.ico { cursor: pointer; }
.ico .ibg { fill: #000; }
.ico .ibd { fill: none; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
.iglyph { fill: none; stroke-width: .9; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.ico:hover .ibd { stroke-width: 2.6; }
.ico.got { opacity: .3; }
.icnt { fill: #fff; font-family: var(--mono); font-weight: 600; paint-order: stroke; stroke: #000; stroke-width: 1.8px; stroke-linejoin: round; pointer-events: none; }
.imore rect { fill: var(--raise); stroke: var(--muted); stroke-width: 1; vector-effect: non-scaling-stroke; }
.imore text { fill: var(--text); font-family: var(--mono); pointer-events: none; }
.legend .ichips { gap: 3px 4px; }
.lchip { display: inline-flex; align-items: center; gap: 4px; background: transparent; border: 1px solid transparent; border-radius: 3px; padding: 1px 5px 1px 3px; font-size: 11px; color: var(--text); }
.lchip[aria-pressed="false"] { color: var(--muted); opacity: .55; }
.lchip[aria-pressed="false"] .isw { background: transparent; }
.lchip:hover { border-color: var(--line); }
.isw { display: inline-block; width: 10px; height: 10px; background: #000; border: 2px solid; border-radius: 2px; box-sizing: border-box; }
.isw.round { border-radius: 50%; }
.route { fill: none; stroke: var(--route); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; opacity: .9; pointer-events: none; }
.route.alt1 { stroke: #7fc6e6; stroke-dasharray: 5 3; }
.route.alt2 { stroke: #c58fd8; stroke-dasharray: 2 3; }
.route.leg { stroke-width: 3.2; }
.route.past { opacity: .35; }
.route.walked { opacity: .55; }
.route.ahead { stroke: #8da2b8; stroke-width: 1.2; opacity: .5; }
.route.way { stroke-width: 1.6; stroke-dasharray: 4 3; opacity: .9; }
.rarrow { fill: var(--route); stroke: var(--ink); stroke-width: .5; vector-effect: non-scaling-stroke; pointer-events: none; }
.room.off { fill-opacity: .25; }
.room.side { fill-opacity: .55; }
.room.on { stroke: #f0c987; stroke-width: 1.3; }
.room.cur { stroke: var(--amber); stroke-width: 2.8; }
.curfill { fill: var(--amber); opacity: .16; pointer-events: none; }
.walker { fill: #fff; stroke: var(--amber); stroke-width: 2.2; vector-effect: non-scaling-stroke; pointer-events: none; }
.xcurve { fill: none; stroke: #5d7086; stroke-width: .8; vector-effect: non-scaling-stroke; opacity: .55; pointer-events: none; }
.xcurve.route { stroke: var(--route); opacity: .9; stroke-width: 1.6; }
.me { fill: var(--amber); stroke: var(--ink); stroke-width: 1; vector-effect: non-scaling-stroke; pointer-events: none; }
.me-ring { fill: none; stroke: var(--amber); vector-effect: non-scaling-stroke; pointer-events: none; animation: ring 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ring { from { opacity: .9; transform: scale(.6); } to { opacity: 0; transform: scale(2.4); } }
@media (prefers-reduced-motion: reduce) { .me-ring { animation: none; opacity: .6; } .arrive { animation: none; opacity: .8; } .room { transition: none; } }
.ftitle { fill: var(--muted); font: 400 14px var(--display); }
.fframe { fill: none; stroke: var(--line); stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; }

/* side panel */
.side { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; background: transparent; border: 0; padding: 9px 4px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--amber); }
.pane { overflow: auto; padding: 12px 14px 18px; min-height: 0; }
.pane h2 { font: 400 17px/1.2 var(--display); margin: 0 0 6px; text-wrap: balance; }
.pane h3 { font: 600 11px/1.3 var(--ui); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 6px; }
.pane p { margin: 0 0 8px; }
.note { color: var(--muted); font-size: 12px; }
.sub { color: var(--muted); font-size: 12px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 6px 0 4px; }
.stat { background: var(--raise); border-radius: 3px; padding: 6px 8px; }
.stat b { display: block; font: 500 18px/1.1 var(--lcd); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); }
ul.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
ul.list li { display: flex; gap: 8px; align-items: baseline; padding: 4px 6px; border-radius: 3px; }
ul.list li.click { cursor: pointer; }
ul.list li.click:hover, ul.list li.on { background: var(--raise); }
.tag { font: 500 10.5px/1.5 var(--mono); padding: 0 5px; border-radius: 2px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.ok { color: var(--herb); border-color: color-mix(in srgb, var(--herb) 50%, var(--line)); }
.tag.bad { color: var(--blood); border-color: color-mix(in srgb, var(--blood) 50%, var(--line)); }
.tag.ev { color: var(--violet); border-color: color-mix(in srgb, var(--violet) 50%, var(--line)); }
.tag.am { color: var(--amber); border-color: var(--amber-dim); }
.grow { flex: 1; min-width: 0; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.btn { background: var(--raise); border: 1px solid var(--line); border-radius: 3px; padding: 5px 10px; }
.btn.primary { border-color: var(--amber-dim); color: var(--amber); }
.btn:disabled { opacity: .4; cursor: default; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.inv { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 10px; }
.inv label { display: flex; gap: 6px; align-items: baseline; font-size: 12.5px; padding: 2px 0; cursor: pointer; min-width: 0; }
.inv label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inv input { accent-color: var(--amber); }
.inv label.na { opacity: .35; }
.steps { counter-reset: s; }
.stepper { position: sticky; top: -12px; z-index: 2; background: var(--panel); margin: -12px -14px 10px; padding: 10px 14px 6px; border-bottom: 1px solid var(--line); }
.stepper .btnrow { margin: 0 0 6px; align-items: center; }
.stepper input[type=range] { width: 100%; accent-color: var(--amber); margin: 0 0 4px; }
.stepper p { margin: 0 0 4px; }
.ways { display: grid; gap: 4px; margin-bottom: 6px; }
.legline { display: flex; flex-wrap: wrap; gap: 3px 2px; align-items: center; margin: 2px 0 4px; }
.lstop { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 0 7px; font-size: 11.5px; line-height: 1.6; color: var(--text); }
.lstop:hover { border-color: var(--muted); }
.lstop.done { color: var(--muted); }
.lstop.now { border-color: var(--amber); color: var(--amber); background: var(--raise); }
.lstop.goal { font-weight: 600; }
.legline .arr { color: var(--muted); font-size: 11px; padding: 0 1px; }
.stepper .toggles { display: flex; flex-wrap: wrap; gap: 2px 14px; }
.way { display: flex; gap: 8px; align-items: flex-start; text-align: left; background: transparent; border: 1px solid var(--line); border-radius: 3px; padding: 5px 8px; }
.way[aria-pressed="true"] { border-color: var(--amber); background: var(--raise); }
.way i { width: 16px; height: 4px; border-radius: 2px; margin-top: 8px; flex: none; }
.steps li { align-items: flex-start !important; }
.steps .n { font: 500 11px/1.9 var(--mono); color: var(--muted); min-width: 22px; text-align: right; }
.strip { display: flex; height: 14px; border-radius: 2px; overflow: hidden; margin: 6px 0 2px; }
.strip i { display: block; height: 100%; }
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.t th { text-align: left; font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--line); padding: 4px 4px; cursor: pointer; white-space: nowrap; position: sticky; top: 0; background: var(--panel); }
table.t td { padding: 3px 4px; border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); }
table.t td.num, table.t th.num { text-align: right; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover, table.t tr.on { background: var(--raise); }
.tablebox { max-height: 360px; overflow: auto; border: 1px solid var(--line); border-radius: 3px; }
.bar { height: 6px; background: var(--amber-dim); border-radius: 1px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.content-item { padding: 5px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); font-size: 12.5px; }
.content-item b { font-weight: 600; }
.credit { margin-top: 18px; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.credit a { color: var(--muted); }
.warn { color: var(--blood); }

.bgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 4px; margin: 4px 0 6px; }
.bgcell { aspect-ratio: var(--ar); background-color: #000; background-repeat: no-repeat; border-radius: 2px; border: 1px solid var(--line); padding: 0; cursor: zoom-in; display: block; width: 100%; }
.bgcell:hover, .bgcell:focus-visible { border-color: var(--amber); }
.thumb { width: 54px; aspect-ratio: 5 / 4; flex: none; border-radius: 2px; background-repeat: no-repeat; background-color: #000; border: 1px solid var(--line); }
.thumb.lg { width: 84px; }
.thumb.cat { border-width: 2px; }
.ci { display: flex; gap: 8px; align-items: flex-start; }
.tipimg { width: 220px; max-width: 100%; aspect-ratio: var(--ar); background-repeat: no-repeat; margin-top: 5px; border-radius: 2px; }
.lb { position: fixed; inset: 0; z-index: 30; background: rgba(3, 5, 8, .94); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.lb .stage { display: flex; align-items: center; justify-content: center; min-height: 0; }
.lb .pic { width: min(100%, calc((100vh - 150px) * var(--arn))); aspect-ratio: var(--ar); background-repeat: no-repeat; }
.lb .bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; height: auto; background: none; }
.lb .bar h2 { font: 400 18px var(--display); margin: 0; }
.lb .strip { display: flex; gap: 4px; overflow-x: auto; height: auto; padding-bottom: 4px; }
.lb .strip button { width: 72px; flex: none; }
.lb .strip button.on { border-color: var(--amber); }
.modal { position: fixed; inset: 0; z-index: 35; background: rgba(2, 3, 4, .78); display: grid; place-items: center; padding: 16px; }
.modal .abox { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; width: min(640px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 14px 18px 18px; }
.modal .mbar { display: flex; align-items: center; gap: 10px; }
.modal h2 { font: 400 20px var(--display); margin: 0; }
.modal h3 { font: 600 11px/1.3 var(--ui); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 4px; }
.modal code { font: 12px var(--mono); background: var(--raise); padding: 0 4px; border-radius: 2px; overflow-wrap: anywhere; }
.aprog { margin-top: 14px; display: grid; gap: 6px; }
.aprog progress { width: 100%; accent-color: var(--amber); }
.galrow { display: grid; grid-template-columns: minmax(0, 1fr) 96px 96px; gap: 6px; align-items: center; padding: 4px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); }
.galrow .empty { aspect-ratio: 4 / 3; border: 1px dashed var(--line); border-radius: 2px; display: grid; place-items: center; font-size: 10px; color: var(--muted); }
/* ---------- skins ----------
   RE2 (PlayStation, 1998): colours sampled from the game's own status-screen textures (COMMON/DATA/ST0.TIM, SELECT_W.TIM,
   CONFIG.TIM on the Leon disc): brushed gunmetal plates, green ECG/LCD screens, navy fields, pale green-white serif caps.
   REmake (GameCube, 2002): sampled from the HD Remaster's status, file and map screens (id/e_rom/subscr/*.arc): green-black
   gunmetal, olive-tan file paper, bone text, amber labels, copper wall lines on the map, serif type, grain and vignette. */
:root[data-skin="re2"] {
  --ink: #040605; --panel: #2c302d; --raise: #3c413c; --line: #121513; --text: #dce8dc; --muted: #99a097;
  --room: #11142a; --room-line: #8193c9; --reach: #2845a6; --reach-hi: #3a5cc8; --seen: #5b7bd8; --locked: #4c1418;
  --amber: #5be35b; --amber-dim: #2c7a2c; --herb: #5be35b; --blood: #e5483f; --violet: #b45fdc; --door: #e8e8e8; --hatch: #6f7b96;
  --display: "Libre Baskerville", Georgia, "Times New Roman", serif; --lcd: "VT323", "IBM Plex Mono", monospace;
  --ramp: #0b1530, #13306b, #1f4fae, #3d7bd8, #6fd06f, #bdf06a, #f0ffd0;
  --mapbg: linear-gradient(rgba(80, 220, 80, .06) 1px, transparent 1px) 0 0 / 24px 24px, linear-gradient(90deg, rgba(80, 220, 80, .06) 1px, transparent 1px) 0 0 / 24px 24px, #010201;
}
:root[data-skin="re2"] body { background: #040605; }
:root[data-skin="re2"] body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 40; background: repeating-linear-gradient(rgba(0, 0, 0, .1) 0 1px, transparent 1px 3px); }

<script>

const MODES = ["jill-ve", "chris-ve", "jill-easy", "chris-easy", "jill-normal", "chris-normal", "jill-hard", "chris-hard"];

  {id: "quest", label: "Puzzle & quest items", tag: "Puzzle/quest", color: "#b48cff"},
  {id: "health", label: "Healing", tag: "Healing", color: "#5fd068"},
  {id: "weapon", label: "Weapons", tag: "Weapon", color: "#ff5a4e"},
  {id: "ammo", label: "Ammo", tag: "Ammo", color: "#ff9f43"},
  {id: "defense", label: "Defense items & fuel", tag: "Defense/fuel", color: "#ff7bd0"},
  {id: "save", label: "Typewriter, ribbons, item box", tag: "Save/storage", color: "#3fc8f0"},
  {id: "file", label: "Files & maps", tag: "File/map", color: "#d5dbe3"},
  {id: "enemy", label: "Enemies", tag: "Enemy", color: "#d0403a", round: true, off: true},

const ICATM = new Map(ICAT.map(c => [c.id, c]));
const OUT = new Map(D.rooms.map(r => [r.id, []]));
D.doors.forEach((d, i) => {
  d.i = i;
  if (d.ab) OUT.get(d.a).push({d, from: d.a, to: d.b, req: d.ab});

const SAVE = new Set(D.rooms.filter(r => r.save).map(r => r.id));
const tokName = t => (TOK.get(t) || {name: t}).name;
const onFloor = (r, f) => r.outlines.find(o => o.floor === f);
const lpOn = (r, f) => (onFloor(r, f) || r.outlines[0]).lp;

/* ---------- logic engine ---------- */
// A requirement is a list of alternatives; each alternative is a list of tokens that must all be held.
// "@other" means the door is barred on this side until it has been opened from the far side.
function clauseOk(cl, have, d, unlocked) { return cl.every(t => t === "@other" ? unlocked.has(d.i) : have.has(t)); }

  let best = null;
  for (const cl of e.req) {
    const m = cl.filter(t => t === "@other" ? !unlocked.has(e.d.i) : !have.has(t));
    if (!best || m.length < best.length) best = m;

  const prev = new Map([[start, null]]); const q = [start];

/* ---------- assets: pictures from the player's own copies, kept in this browser ---------- */
// A public copy ships no game art and none of Evil Resource's descriptions. The Assets dialog rebuilds the same picture
// sheets the page uses from a Resident Evil (PS1) disc image, a Resident Evil HD Remaster (PS3) .pkg or game folder, or an
// asset pack zip (tools/make_pack.py), and keeps them in IndexedDB. Nothing is uploaded anywhere.
const IDB = {
  db: null,

      r.onupgradeneeded = () => { r.result.createObjectStore("files"); r.result.createObjectStore("meta"); };
      r.onsuccess = () => ok(this.db = r.result); r.onerror = () => no(r.error); }); },
  async run(store, mode, fn) { const db = await this.open();

  put(store, k, v) { return this.run(store, "readwrite", s => s.put(v, k)); },
  get(store, k) { return this.run(store, "readonly", s => s.get(k)); },
  async getMany(keys) { const db = await this.open();
    return new Promise((ok, no) => { const t = db.transaction("files", "readonly"), st = t.objectStore("files"), out = new Map();
      for (const k of keys) { const r = st.get(k); r.onsuccess = () => out.set(k, r.result); }
      t.oncomplete = () => ok(out); t.onerror = () => no(t.error); }); },

}

function applyTexts(t) { for (const r of D.rooms) { const a = t[r.id]; if (a) r.contents.forEach((c, i) => { if (a[i] && !c.d) c.d = a[i]; }); } }
async function loadImported() { // public copy: pictures and descriptions imported earlier in this browser
  if (D.media) return;
  let m, texts;
  try { [m, texts] = await Promise.all([IDB.get("meta", "media"), IDB.get("meta", "texts")]); } catch (e) { return; }
  if (texts) applyTexts(texts);

  m = Object.assign(emptyMedia(), m);
  const refs = []; // [object, key] for every stored file the index points at

// RE1 (PlayStation): each group of the plan is one sheet of 320x240 frames, 4 across, as tools/media.py makes them
async function importRE1(file, ui) {
  ui.say("Reading the disc's file table…");
  const disc = await openDisc(fileRead(file), file.size), plan = D.plan.re1;
  const bss = new Map(disc.files.filter(f => /ROOM\w+\.BSS$/i.test(f.path)).map(f => [f.path.split("/").pop().replace(/\.BSS$/i, "").slice(4).toUpperCase(), f]));
  if (!bss.size) throw new Error("No ROOM*.BSS backgrounds on this disc. Is it Resident Evil for the PlayStation?");
  const med = Object.assign(emptyMedia(), await IDB.get("meta", "media")), keys = Object.keys(plan); let done = 0, frames = 0, missing = 0;
  for (const key of keys) {
    if (ui.stop) throw new Error("Stopped.");
    const g = plan[key], n = g.labels.length, rows = Math.ceil(n / 4), sheet = canvasOf(4 * 320, rows * 240), ctx = sheet.getContext("2d"), cache = new Map();
    for (let i = 0; i < n; i++) {
      const [, code, k] = /^ROOM(\w+)_(\d+)$/.exec(g.labels[i]), f = bss.get(code.toUpperCase());
      if (!f) { missing++; continue; }
      if (!cache.has(code)) cache.set(code, await disc.readFile(f.lba, f.size));
      const blk = cache.get(code).subarray(+k * 32768, (+k + 1) * 32768);
      if (!MDEC.isFrame(blk)) { missing++; continue; }
      try { ctx.putImageData(new ImageData(MDEC.frame(blk), 320, 240), (i % 4) * 320, Math.floor(i / 4) * 240); frames++; } catch (e) { missing++; }
    }
    const path = await saveCanvas(sheet, `re1/${key}`);
    med.re1[key] = {n, labels: g.labels, parts: g.parts, thumb: {file: path, cols: 4, rows, w: 320, h: 240}, full: {files: [path], per: n, cols: 4, w: 320, h: 240}};
    ui.progress(++done / keys.length, `RE1 backgrounds: ${done} of ${keys.length} rooms`); await tick();
  }
  med.re1_only = D.plan.re1_only; await IDB.put("meta", "media", med);
  return `RE1: ${frames} backgrounds for ${done} rooms` + (missing ? ` (${missing} frames not on this disc)` : "") + ".";
}

// REmake HD (PS3): every camera of the plan, full size one file each, plus a thumbnail sheet per room; then the game's
// inventory icons as the item pictures. Reads only the parts of each archive it needs.
async function importPS3(src, ui) {
  const by = new Map(), rel = n => { const m = /(?:^|\/)arc\/(.+)$/.exec(n.replace(/\\/g, "/")); return m && "arc/" + m[1]; };
  if (src instanceof File) {
    ui.say("Opening the package…");
    const pkg = await openPkg(fileRead(src));
    for (const e of pkg.entries) { const r = rel(e.name); if (r) by.set(r, {read: pkg.reader(e), size: e.size}); }
  } else for (const f of src) { const r = rel(f.webkitRelativePath || f.name); if (r) by.set(r, {read: fileRead(f), size: f.size}); }
  if (!by.has("arc/scr/st01/r106/r10600.arc")) throw new Error("No REmake camera archives (arc/scr/…) found. Pick the game's .pkg file, or its USRDIR or nativePS3 folder.");
  const plan = D.plan.remake, rooms = Object.keys(plan), total = rooms.reduce((a, r) => a + plan[r].length, 0);
  const med = Object.assign(emptyMedia(), await IDB.get("meta", "media")); let done = 0, missing = 0, roomsDone = 0;
  for (const room of rooms) {
    if (ui.stop) throw new Error("Stopped.");
    const got = []; // [camera index, label, stored file, 192x144 thumbnail]
    await pool(plan[room].map((lab, i) => async () => {
      if (ui.stop) return;
      const [code, cam] = lab.split("_"), f = by.get(`arc/scr/st0${code[1]}/${code}/${code}${cam}.arc`);
      const bg = f && await arcBackground(f.read, f.size).catch(() => null);
      if (!bg) { missing++; return; }
      const c = pxCanvas(bg.px, bg.w, bg.h), t = canvasOf(192, 144), tc = t.getContext("2d");
      tc.imageSmoothingQuality = "high"; tc.drawImage(c, 0, 0, 192, 144);
      got.push([i, lab, await saveCanvas(c, `ps3/${room}/${lab}`, .8), t]);
      ui.progress(++done / total, `REmake backgrounds: ${done} of ${total} cameras`);
    }), 3);
    if (!got.length) continue; // nothing for this room in what was picked: keep whatever an earlier import gave it
    got.sort((a, b) => a[0] - b[0]);
    const n = got.length, rows = Math.ceil(n / 6), th = canvasOf(6 * 192, rows * 144), tctx = th.getContext("2d");
    got.forEach(([, , , t], k) => tctx.drawImage(t, (k % 6) * 192, Math.floor(k / 6) * 144));
    const tp = await saveCanvas(th, `ps3/${room}/thumbs`, .8);
    med.remake[room] = {n, src: "ps3", labels: got.map(g => g[1]), thumb: {file: tp, cols: 6, rows, w: 192, h: 144}, full: {files: got.map(g => g[2]), per: 1, cols: 1, w: 1280, h: 960}};
    await IDB.put("meta", "media", med); roomsDone++;
  }
  let icons = 0; const ia = by.get("arc/id/e_rom/subscr/itemicon.arc");
  if (ia && (!med.items || med.items.src === "ps3")) {
    ui.say("Item pictures from the game's inventory icons…");
    const view = arcView(ia.read, ia.size), list = await arcList(view), slugs = Object.keys(D.plan.icons), index = {};
    const big = canvasOf(12 * 225, Math.ceil(slugs.length / 12) * 180), small = canvasOf(16 * 80, Math.ceil(slugs.length / 16) * 80);
    const bx = big.getContext("2d"), sx = small.getContext("2d"); bx.fillStyle = sx.fillStyle = "#000"; bx.fillRect(0, 0, big.width, big.height); sx.fillRect(0, 0, small.width, small.height);
    for (const [i, slug] of slugs.entries()) {
      const e = list.find(x => x.name.endsWith(`i${String(D.plan.icons[slug]).padStart(3, "0")}s_ID`)); if (!e) continue;
      const t = decodeBC(await arcRead(view, e)), c = pxCanvas(t.px, t.w, t.h);
      let x0 = t.w, y0 = t.h, x1 = 0, y1 = 0; // visible part of the icon
      for (let y = 0; y < t.h; y++) for (let x = 0; x < t.w; x++) if (t.px[(y * t.w + x) * 4 + 3] > 24) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
      if (x1 < x0) continue;
      const side = Math.max(x1 - x0, y1 - y0) * 1.08 + 2, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
      sx.drawImage(c, cx - side / 2, cy - side / 2, side, side, (i % 16) * 80, Math.floor(i / 16) * 80, 80, 80);
      bx.drawImage(c, cx - side / 2, cy - side / 2, side, side, (i % 12) * 225 + 32, Math.floor(i / 12) * 180 + 10, 160, 160);

// Asset pack: the media folder of a private build plus Evil Resource's descriptions (texts.json), zipped by tools/make_pack.py
async function importPack(file, ui) {
  const read = fileRead(file), ents = await zipEntries(read, file.size);
  if (!ents.some(e => /(^|\/)media\.json$/.test(e.name))) throw new Error("No media.json in this zip: it is not an atlas asset pack.");
  let media = null, texts = null, done = 0;
  for (const e of ents) {
    if (ui.stop) throw new Error("Stopped.");
    let blob = file.slice(e.start, e.start + e.csize);
    if (e.method === 8) blob = new Blob([await inflateBytes(new Uint8Array(await blob.arrayBuffer()), true)]);
    else if (e.method) throw new Error("Unsupported compression in " + e.name);
    if (/(^|\/)media\.json$/.test(e.name)) media = JSON.parse(await blob.text());
    else if (/(^|\/)texts\.json$/.test(e.name)) texts = JSON.parse(await blob.text());
    else await IDB.put("files", e.name, new Blob([blob], {type: MIME[e.name.split(".").pop()] || ""}));
    ui.progress(++done / ents.length, `Asset pack: ${done} of ${ents.length} files`);
  }
  if (media.items) media.items.src = "pack";
  await IDB.put("meta", "media", Object.assign(emptyMedia(), media));
  if (texts) await IDB.put("meta", "texts", texts);
  return `Asset pack: ${Object.keys(media.remake || {}).length} REmake rooms, ${Object.keys(media.re1 || {}).length} RE1 groups, ${media.items ? Object.keys(media.items.index).length : 0} item pictures${texts ? ", room descriptions" : ""}.`;
}

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; if (S.tab !== "route") playStop(); if (S.tab === "route" && S.routeLeg < 0 && S.colorby === "reach") { S.colorby = "visits"; $("#colorby").value = "visits"; } draw(); drawPane(); });
$("#subtitle").textContent = `Resident Evil (2002) · ${D.rooms.length} rooms · ${D.doors.length} doors · ${D.tokens.length} items and events`;
recompute(); fitView(); render();
if (!D.media) loadImported().then(render);
</script>
